services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install && pnpm dev"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-4002}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
      - room-server
    ports:
      - "${WEB_PORT:-4001}:5173"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: cargo watch -w apps/api -w crates/common -w migrations -x "run -p sidepiece-api"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    environment:
      API_ADDR: 0.0.0.0:4000
      DATABASE_URL: postgres://sidepiece:sidepiece@postgres:5432/sidepiece
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sidepiece-assets
      S3_ACCESS_KEY: sidepiece
      S3_SECRET_KEY: sidepiece-dev-secret
      ROOM_WS_PUBLIC_URL: ws://localhost:${ROOM_PORT:-4003}/ws
      ALLOW_DEV_LOGIN: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RUST_LOG: info
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - rust_target:/app/target
    ports:
      - "${API_PORT:-4002}:4000"

  room-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: cargo watch -w apps/room-server -w crates/common -x "run -p sidepiece-room-server"
    depends_on:
      redis:
        condition: service_started
      nats:
        condition: service_started
    environment:
      ROOM_ADDR: 0.0.0.0:4001
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      RUST_LOG: info
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - rust_target:/app/target
    ports:
      - "${ROOM_PORT:-4003}:4001"

  event-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: cargo watch -w apps/event-worker -w crates/common -w migrations -x "run -p sidepiece-event-worker"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DATABASE_URL: postgres://sidepiece:sidepiece@postgres:5432/sidepiece
      NATS_URL: nats://nats:4222
      RUST_LOG: info
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - rust_target:/app/target

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sidepiece
      POSTGRES_PASSWORD: sidepiece
      POSTGRES_DB: sidepiece
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-4004}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidepiece"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-4005}:6379"

  nats:
    image: nats:2-alpine

volumes:
  postgres_data:
  web_node_modules:
  cargo_registry:
  cargo_git:
  rust_target:
