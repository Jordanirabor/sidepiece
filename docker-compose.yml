# Production / Dokploy stack.
# Secrets come from the environment (Dokploy "Environment" tab or a .env file next to this file).
# Only web, api and room-server should get public domains in Dokploy; data services stay internal.
services:
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL, e.g. https://api.example.com}
    restart: unless-stopped
    depends_on:
      - api
      - room-server
    expose:
      - "80"

  api:
    build: .
    command: sidepiece-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      APP_ENV: production
      API_ADDR: 0.0.0.0:4000
      DATABASE_URL: postgres://sidepiece:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sidepiece
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to 32+ random characters}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS, e.g. https://play.example.com}
      ROOM_WS_PUBLIC_URL: ${ROOM_WS_PUBLIC_URL:?set ROOM_WS_PUBLIC_URL, e.g. wss://ws.example.com/ws}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-sidepiece-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # NPC conversation model (any OpenAI-compatible API). Leave LLM_BASE_URL empty for the offline fallback.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4000'"]
      interval: 10s
      timeout: 3s
      retries: 6

  room-server:
    build: .
    command: sidepiece-room-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      ROOM_ADDR: 0.0.0.0:4001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://nats:4222
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "4001"

  event-worker:
    build: .
    command: sidepiece-event-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DATABASE_URL: postgres://sidepiece:${POSTGRES_PASSWORD}@postgres:5432/sidepiece
      NATS_URL: nats://nats:4222
      RUST_LOG: ${RUST_LOG:-info}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sidepiece
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sidepiece
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidepiece"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-m", "8222"]

volumes:
  postgres_data:
  redis_data:
